[project]
name = "interfaz4"
version = "0.1.0"
description = "Interfaz 4: contexto meteorológico para visitas a apiarios (organizar, no interpretar)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "h5py>=3.11",
    "s3fs>=2024.6",
    "shapely>=2.0",
    "typer>=0.12",
    "defusedxml>=0.7",
]

[project.scripts]
interfaz4 = "interfaz4.cli:app"

[dependency-groups]
dev = [
    # xarray/h5netcdf solo para scripts/ (verificación y fixtures); el motor lee con h5py.
    "xarray>=2024.6",
    "h5netcdf>=1.3",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interfaz4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
