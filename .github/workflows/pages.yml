name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'interfaz*.html'
      - 'assets/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'interfaz4/publico/**'
      - 'bitacoraderevision/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html interfaz1.html interfaz2.html interfaz3.html interfaz4.html sw.js manifest.webmanifest .nojekyll _site/
          cp -r assets _site/assets
          # Copia de respaldo del estado que publica el motor de Interfaz 4
          # (la página lo lee primero de raw.githubusercontent.com).
          mkdir -p _site/interfaz4
          cp -r interfaz4/publico _site/interfaz4/publico
          # Bitácora de revisión + mapa: sitio autocontenido. El Codigo.gs se
          # pega a mano en Apps Script, no hace falta publicarlo.
          cp -r bitacoraderevision _site/bitacoraderevision
          rm -rf _site/bitacoraderevision/apps-script

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
